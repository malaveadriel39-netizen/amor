<style>
:root{
  --night:#120822;--plum:#3b1240;--wine:#8a2b5e;--low:#c94a7e;
  --rose:#ff4f7e;--roseD:#c92f5d;--blush:#ffd6e1;--gold:#f5c16c;--goldD:#c9913a;
  --cream:#fff8f2;--ink:#2e0f2a;--muted:#8b6680;--ghost:#b99ab0;

  --display:"Fraunces",Georgia,"Times New Roman",serif;
  --body:"Nunito","Segoe UI",system-ui,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;background:var(--night);overflow-x:hidden}
body{font-family:var(--body);color:#fff;background:linear-gradient(180deg,var(--night) 0%,var(--plum) 50%,var(--wine) 82%,var(--low) 100%) fixed;

#sky{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:0}
#app{position:relative;z-index:1;max-width:440px;margin:0 auto;min-height:100dvh;

.view{display:flex;flex-direction:column;gap:18px;flex:1;animation:in .45s cubic-bezier(.2,.9,.3,1)}

h1,h2{font-family:var(--display);font-weight:700;margin:0;text-wrap:balance;line-height:1.1}
h1{font-size:44px}h2{font-size:28px;text-align:center}
p{margin:0;line-height:1.5}
.sub{color:var(--blush);text-align:center;font-size:15.5px;text-wrap:balance}
.eyebrow{font-weight:800;font-size:11.5px;letter-spacing:.24em;text-transform:uppercase;color:var(--gold);text-align:center}
.center{text-align:center}.grow{flex:1}
.card{background:var(--cream);color:var(--ink);border-radius:22px;padding:22px}
.glass{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.1);border-radius:20px;padding:18px}
.btn{appearance:none;border:0;font:800 17px var(--body);color:#fff;background:var(--rose);border-radius:999px;padding:16px 28px;

.btn:active{transform:translateY(4px);box-shadow:0 1px 0 var(--roseD)}
.btn.ghost{background:transparent;border:1.5px solid rgba(255,255,255,.55);box-shadow:none}
.btn:focus-visible,.opt:focus-visible,.key:focus-visible{outline:3px solid var(--gold);outline-offset:3px}
.opts{display:flex;flex-direction:column;gap:12px}
.opts.row{flex-direction:row;justify-content:space-between}
.opts.row .opt{flex:1}
.opt{appearance:none;border:0;background:var(--blush);color:var(--ink);font:800 18px var(--body);border-radius:16px;padding:18px 14px;cursor:pointer;
  display:flex;align-items:center;justify-content:center;gap:8px;min-height:60px;transition:transform .1s,background .2s}
.opt:active{transform:scale(.97)}
.opt.good{background:var(--gold)}
.opt.white{background:var(--cream)}
.shake{animation:shake .45s}
@keyframes shake{20%{transform:translateX(-9px)}40%{transform:translateX(8px)}60%{transform:translateX(-6px)}80%{transform:translateX(4px)}}
.hint{min-height:44px;text-align:center;color:var(--blush);font-size:14.5px;opacity:0;transition:opacity .3s}
.hint.show{opacity:1}
.hint b{color:var(--gold)}

.hud{display:grid;grid-template-columns:1fr auto;align-items:center;gap:8px 12px}
.hud .lvl{font-weight:800;font-size:11px;letter-spacing:.22em;color:var(--blush)}
.bar{grid-column:1/-1;display:flex;gap:5px}
.bar i{flex:1;height:5px;border-radius:3px;background:rgba(255,255,255,.18);transition:background .4s}
.bar i.on{background:var(--gold)}
#mute{position:fixed;right:max(12px,calc(50% - 220px + 12px));bottom:calc(env(safe-area-inset-bottom,0px) + 12px);z-index:5;width:40px;height:40px;border-radius:50%;
  border:1px solid rgba(255,255,255,.25);background:rgba(18,8,34,.5);color:#fff;display:grid;place-items:center;cursor:pointer}

.const line{stroke-linecap:round}
.const .lit{animation:pop .7s cubic-bezier(.2,1.6,.4,1) both}
@keyframes pop{from{transform:scale(0);opacity:0}to{transform:scale(1);opacity:1}}

.game canvas{display:block;width:100%;height:100%}
.gstats{display:flex;justify-content:space-between;font-weight:800;font-size:15px}
.overlay{position:absolute;inset:0;display:grid;place-items:center;background:rgba(18,8,34,.72);text-align:center;padding:20px;gap:12px}

.qbox{width:52px;height:56px;border:2px dashed var(--gold);border-radius:12px;display:grid;place-items:center;font:700 28px var(--display);color:var(--gold)}

.keygrid div{display:flex;align-items:center;gap:6px;font:700 18px var(--mono);color:var(--ink)}
.msg{display:flex;justify-content:center;gap:12px;align-items:center}
.msg .sp{width:14px}

.slot{width:54px;height:54px;border-radius:14px;background:rgba(255,255,255,.1);display:grid;place-items:center}
.timer{height:5px;border-radius:3px;background:var(--gold);transform-origin:left}

.bulb small{font-weight:800;font-size:8.5px;letter-spacing:.04em;color:var(--ghost)}

.sum{font:700 40px var(--mono);text-align:center}
.sum span{color:var(--ghost);font-size:22px}

.quote{font-family:var(--display);font-style:italic;font-size:18px;color:var(--blush);text-align:center;text-wrap:balance}

.slots4 div.f{background:var(--cream);color:var(--ink)}
.keys{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}

.key:active{background:rgba(255,255,255,.24)}

.lock.open .shackle{transform:translateY(-16px)}
.big{font:700 72px var(--mono);text-align:center;letter-spacing:.06em}

.letter{background:var(--cream);color:var(--ink);border-radius:10px;padding:26px 22px 22px;

@keyframes unfold{from{transform:scaleY(.05) translateY(120px);opacity:0}to{transform:none;opacity:1}}
.letter .to{font-weight:800;font-size:10.5px;letter-spacing:.24em;color:var(--muted);text-align:center;margin-bottom:10px}
.letter .txt{font-family:var(--display);font-style:italic;font-size:17px;line-height:31px;white-space:pre-wrap;min-height:300px}
.letter .txt.typing::after{content:"|";color:var(--rose);animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.letter .sign{font-family:var(--display);font-style:italic;font-size:22px;color:var(--rose);text-align:right;opacity:0;transition:opacity 1s}
.seal{appearance:none;border:0;align-self:center;width:64px;height:64px;border-radius:50%;background:radial-gradient(circle,#9a1f44 0 58%,#b3264f 60%);
  display:grid;place-items:center;cursor:pointer;box-shadow:0 4px 12px rgba(0,0,0,.3);opacity:0;transform:scale(.6);transition:all .5s}
.seal.show{opacity:1;transform:none}
.sealtxt{font-size:12px;color:var(--muted);text-align:center;opacity:0;transition:opacity .5s}
.ticket{position:relative;background:var(--cream);color:var(--ink);border-radius:18px;padding:34px 24px;text-align:center}

.ticket h3{font:700 22px/1.3 var(--display);margin:10px 0 14px;text-wrap:balance}
.ticket small{font-family:var(--display);font-style:italic;color:var(--muted);font-size:14px}
.tl{position:relative;display:flex;flex-direction:column;gap:30px;padding-left:44px}
.tl::before{content:"";position:absolute;left:15px;top:8px;bottom:8px;width:2px;background:rgba(245,193,108,.5)}

.tl .dot{position:absolute;left:-44px;top:0;width:32px;height:32px;border-radius:50%;background:var(--plum);display:grid;place-items:center}
.tl .d{font-weight:800;font-size:11px;letter-spacing:.2em;color:var(--gold)}

.tl p{color:var(--blush);font-size:15px}
.burst{position:fixed;pointer-events:none;z-index:9;will-change:transform,opacity}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style>

  bad:   () => { tone(260, .16, "square", .09, 0, 150); tone(180, .22, "square", .08, .12, 110); }, // error

  pop:   (n) => tone(300 + n * 160, .16, "triangle", .2, 0, 600 + n * 200),          // tocar el regalo

// Constelación en forma de corazón (9 estrellas; el vértice 5 es la hendidura)
const V = [[0, -1], [-.55, -.42], [-.97, .12], [-.86, .7], [-.42, .92], [0, .52], [.42, .92], [.86, .7], [.97, .12], [.55, -.42]];
const STARS = [0, 1, 2, 3, 4, 6, 7, 8, 9];
function constellation(lit, size = 200, animateLast = false, heartFill = false) {
  const s = 100, pts = V.map(([x, y]) => [120 + x * s, 115 - y * s]);
  const on = v => v === 5 ? lit >= 6 : STARS.indexOf(v) < lit;
  let g = "";
  if (heartFill) g += `<path d="${HEART_D}" transform="translate(60 52) scale(5)" fill="${COL.rose}" opacity=".95"/>`;
  pts.forEach((p, i) => { const q = pts[(i + 1) % pts.length], l = on(i) && on((i + 1) % pts.length);
    g += `<line x1="${p[0]}" y1="${p[1]}" x2="${q[0]}" y2="${q[1]}" stroke="${l ? COL.gold : "#fff"}" stroke-opacity="${l ? .9 : .25}" stroke-width="${l ? 2.5 : 1.5}" ${l ? "" : 'stroke-dasharray="4 5"'}/>`; });
  STARS.forEach((v, n) => { const [x, y] = pts[v];
    if (n < lit) { const cls = animateLast && n === lit - 1 ? ' class="lit"' : "";
      g += `<g${cls} style="transform-origin:${x}px ${y}px"><circle cx="${x}" cy="${y}" r="15" fill="${COL.gold}" opacity=".22"/><polygon points="${starPts(x, y, 10)}" fill="${COL.gold}"/></g>`; }
    else g += `<circle cx="${x}" cy="${y}" r="3.2" fill="#fff" opacity=".5"/>`; });
  return `<svg class="const" viewBox="0 0 240 240" width="${size}" height="${size}" style="overflow:visible">${g}</svg>`;
}
const padlock = (open = false) => `<svg class="lock${open ? " open" : ""}" viewBox="0 0 100 110" width="96" height="106" style="overflow:visible;margin-top:18px">
  <path class="shackle" d="M26 52V34a24 24 0 0 1 48 0v18" fill="none" stroke="${COL.gold}" stroke-width="10" stroke-linecap="round"/>

/* partículas de corazones */
function burst(x, y, n = 18) {
  for (let i = 0; i < n; i++) {
    const el = document.createElement("div"); el.className = "burst";
    const k = ["heart", "heart", "star"][i % 3], s = 14 + Math.random() * 18;
    el.innerHTML = sym(k, s); el.style.left = (x - s / 2) + "px"; el.style.top = (y - s / 2) + "px";
    document.body.appendChild(el);
    const a = Math.random() * Math.PI * 2, d = 70 + Math.random() * 150;
    el.animate([{ transform: "translate(0,0) scale(.4)", opacity: 1 }, { transform: `translate(${Math.cos(a) * d}px,${Math.sin(a) * d + 60}px) scale(1) rotate(${Math.random() * 90 - 45}deg)`, opacity: 0 }],
      { duration: 900 + Math.random() * 600, easing: "cubic-bezier(.2,.8,.3,1)" }).onfinish = () => el.remove();
  }
}
const burstAt = (el, n) => { const r = el.getBoundingClientRect(); burst(r.left + r.width / 2, r.top + r.height / 2, n); };

/* cielo animado */
const sky = document.getElementById("sky"), sctx = sky.getContext("2d");
let stars = [], floaters = [], floatOn = false;
function resizeSky() { const d = Math.min(devicePixelRatio || 1, 2); sky.width = innerWidth * d; sky.height = innerHeight * d; sctx.setTransform(d, 0, 0, d, 0, 0);
  stars = Array.from({ length: 90 }, () => ({ x: Math.random() * innerWidth, y: Math.random() * innerHeight * .75, r: Math.random() * 1.4 + .3, p: Math.random() * 6 })); }
addEventListener("resize", resizeSky); resizeSky();
(function loop(t) {
  sctx.clearRect(0, 0, innerWidth, innerHeight);
  for (const s of stars) { sctx.globalAlpha = .3 + .6 * Math.abs(Math.sin(t / 900 + s.p)); sctx.fillStyle = "#fff"; sctx.beginPath(); sctx.arc(s.x, s.y, s.r, 0, 7); sctx.fill(); }
  if (floatOn && Math.random() < .05) floaters.push({ x: Math.random() * innerWidth, y: innerHeight + 20, v: 30 + Math.random() * 40, s: 10 + Math.random() * 16, w: Math.random() * 6 });
  for (const f of floaters) { f.y -= f.v / 60; sctx.globalAlpha = Math.min(.55, f.y / innerHeight); drawHeart(sctx, f.x + Math.sin(t / 700 + f.w) * 10, f.y, f.s, COL.rose); }
  floaters = floaters.filter(f => f.y > -30); sctx.globalAlpha = 1;

})(0);
function drawHeart(c, x, y, s, col) {
  c.save(); c.translate(x - s / 2, y - s / 2); c.scale(s / 24, s / 24); c.fillStyle = col; c.fill(new Path2D(HEART_D)); c.restore();

/* dígito que entrega cada nivel de CONFIG.nivelesConNumero (lo escribe build.py) */
const CODE_DIGITS = ["1", "4", "3", "3"];

/* ============================== niveles ============================== */
function nivel(lv) { state.lv = Math.max(state.lv, lv); store.set(state); ({ 1: n1, 2: quiz, 3: n3, 4: quiz, 5: n5, 6: n6, 7: n7, 8: quiz, 9: n9 })[lv](lv); }

// 1 · Atrapa corazones
function n1(lv) {
  const GOAL = 12;
  const v = frame(lv, "Atrapa mi corazón", `Atrapa ${GOAL} corazones con la canasta y esquiva los rotos.`,
    `<div class="gstats"><span id="sc">0 / ${GOAL}</span><span id="lv"></span></div><div class="game" style="height:min(56dvh,460px)"><canvas></canvas>
     <div class="overlay" id="ov"><div style="display:grid;gap:14px;justify-items:center">${sym("heart", 54)}<p>Arrastra el dedo para mover la canasta.</p><button class="btn" id="play">¡Vamos!</button></div></div></div>`);
  const box = v.querySelector(".game"), cv = box.querySelector("canvas"), c = cv.getContext("2d"), ov = v.querySelector("#ov");
  let W, H, run = false, items = [], score = 0, lives = 3, px = 0, tx = 0, spawn = 0, last = 0, shake = 0, raf, keys = {};
  const size = () => { const d = Math.min(devicePixelRatio || 1, 2); W = box.clientWidth; H = box.clientHeight; cv.width = W * d; cv.height = H * d; c.setTransform(d, 0, 0, d, 0, 0); };
  size(); px = tx = W / 2;
  const stats = () => { v.querySelector("#sc").textContent = `${score} / ${GOAL}`; v.querySelector("#lv").innerHTML = Array.from({ length: 3 }, (_, i) => sym(i < lives ? "heart" : "broken", 20)).join(""); };
  stats();
  const move = e => { const r = cv.getBoundingClientRect(); tx = e.clientX - r.left; };
  cv.addEventListener("pointerdown", move); cv.addEventListener("pointermove", move);
  const kd = e => keys[e.key] = true, ku = e => keys[e.key] = false; addEventListener("keydown", kd); addEventListener("keyup", ku);
  function start() { items = []; score = 0; lives = 3; spawn = 0; run = true; ov.style.display = "none"; stats(); last = performance.now(); raf = requestAnimationFrame(tick); }
  v.querySelector("#play").onclick = start;
  function basket(x, y) {
    c.save(); c.translate(x, y);
    c.fillStyle = "#c9913a"; c.beginPath(); c.moveTo(-36, -10); c.lineTo(36, -10); c.lineTo(28, 18); c.lineTo(-28, 18); c.closePath(); c.fill();
    c.strokeStyle = "rgba(255,255,255,.25)"; c.lineWidth = 2; for (let i = -24; i <= 24; i += 12) { c.beginPath(); c.moveTo(i, -8); c.lineTo(i * .8, 16); c.stroke(); }
    c.fillStyle = "#f5c16c"; c.beginPath(); c.roundRect(-40, -16, 80, 9, 4); c.fill(); c.restore();
  }
  function tick(now) {
    if (!run || !document.body.contains(cv)) { removeEventListener("keydown", kd); removeEventListener("keyup", ku); return; }
    const dt = Math.min(.033, (now - last) / 1000); last = now; c.clearRect(0, 0, W, H);
    const dir = (keys.ArrowRight ? 1 : 0) - (keys.ArrowLeft ? 1 : 0); if (dir) tx += dir * 420 * dt;
    tx = Math.max(40, Math.min(W - 40, tx)); px += (tx - px) * Math.min(1, dt * 14);
    const prog = score / GOAL; spawn -= dt;
    if (spawn <= 0) { const bad = Math.random() < .18 + prog * .12; items.push({ x: 24 + Math.random() * (W - 48), y: -20, v: (140 + Math.random() * 90) * (1 + prog * .8), bad, r: (Math.random() - .5) * 2, a: 0, gold: !bad && Math.random() < .12 }); spawn = .75 - prog * .3; }
    const by = H - 34;
    for (const it of items) {
      it.y += it.v * dt; it.a += it.r * dt;
      if (!it.hit && Math.abs(it.x - px) < 40 && Math.abs(it.y - by) < 22) {
        it.hit = true;
        if (it.bad) { lives--; shake = .3; sfx.hurt(); if (navigator.vibrate) navigator.vibrate(50); }
        else { score += it.gold ? 2 : 1; sfx.catch(); const r = cv.getBoundingClientRect(); burst(r.left + it.x, r.top + it.y, 5); }
        stats();
      }
      c.save(); c.translate(it.x, it.y); c.rotate(it.a);
      c.translate(-15, -15); c.scale(30 / 24, 30 / 24); c.fillStyle = it.bad ? COL.ghost : it.gold ? COL.gold : COL.rose; c.fill(new Path2D(HEART_D));
      if (it.bad) { c.strokeStyle = "#3b1240"; c.lineWidth = 1.6; c.stroke(new Path2D("M12 7.6 10.4 11l2.6 2-1.8 3.4")); }
      c.restore();
    }
    items = items.filter(i => !i.hit && i.y < H + 30);
    basket(px + (shake > 0 ? (Math.random() - .5) * 10 : 0), by); shake -= dt;
    if (score >= GOAL) { run = false; sfx.right(); setTimeout(() => win(lv), 350); return; }
    if (lives <= 0) { run = false; fail(v, lv, box); ov.style.display = "grid"; ov.innerHTML = `<div style="display:grid;gap:14px;justify-items:center">${sym("broken", 54)}<p>Se rompieron 3 corazones.</p><button class="btn" id="again">Intentar de nuevo</button></div>`; ov.querySelector("#again").onclick = start; return; }
    raf = requestAnimationFrame(tick);
  }
}

  });
}

// 6 · Mensaje cifrado
function n6(lv) {
  const KEY = [["heart", "T"], ["star", "E"], ["circle", "A"], ["diamond", "M"], ["triangle", "O"], ["square", "R"], ["ring", "S"], ["plus", "I"]];
  const opts = shuffle([["TE AMO", true], ["ME ATO", false], ["TOMATE", false]]);
  const v = frame(lv, "Mensaje cifrado", "Usa la clave para descifrar lo que te escribí.",
    `<div class="card"><p class="eyebrow" style="color:var(--muted);margin-bottom:14px">Clave</p><div class="keygrid">${KEY.map(([k, l]) => `<div>${sym(k, 24)}= ${l}</div>`).join("")}</div></div>
     <div class="glass msg">${["heart", "star", null, "circle", "diamond", "triangle"].map(k => k ? sym(k, 34) : '<span class="sp"></span>').join("")}</div>
     <div class="opts row">${opts.map(([t], i) => `<button class="opt" data-i="${i}" style="font:700 16px var(--mono);padding:18px 6px">${t}</button>`).join("")}</div>`);
  v.querySelectorAll(".opt").forEach(b => b.onclick = () => { if (opts[+b.dataset.i][1]) { b.classList.add("good"); sfx.right(); burstAt(b, 18); setTimeout(() => win(lv), 600); } else fail(v, lv, b); });
}

// 7 · Memoria real (las figuras se esconden)
function n7(lv) {
  const MEM = ["heart", "diamond", "star", "circle", "triangle"];
  const v = frame(lv, "Memoriza", "Mira el orden de estas 5 figuras. En unos segundos se van a esconder.",
    `<div class="glass" style="display:grid;gap:16px"><div class="slots" id="sl"></div><div class="timer" id="tm"></div></div>
     <div class="slots" id="pal" style="flex-wrap:wrap"></div><button class="btn ghost" id="again" style="display:none">Verlas otra vez</button>`);
  const sl = v.querySelector("#sl"), pal = v.querySelector("#pal"), tm = v.querySelector("#tm"), again = v.querySelector("#again");
  async function round() {
    again.style.display = "none"; pal.innerHTML = ""; v.querySelector(".hint").classList.remove("show");
    sl.innerHTML = MEM.map(k => `<div class="slot">${sym(k, 34)}</div>`).join("");
    tm.style.visibility = "visible"; tm.animate([{ transform: "scaleX(1)" }, { transform: "scaleX(0)" }], { duration: 4500, fill: "forwards" });
    await wait(4500); if (!document.body.contains(v)) return;
    tm.style.visibility = "hidden"; sl.innerHTML = MEM.map(() => `<div class="slot"></div>`).join("");
    let pos = 0;
    pal.innerHTML = shuffle(MEM).map(k => `<button class="opt white" data-nosnd="1" data-k="${k}" style="width:62px;height:62px;min-height:0;padding:0">${sym(k, 34)}</button>`).join("");
    pal.querySelectorAll("button").forEach(b => b.onclick = () => {
      if (b.dataset.k === MEM[pos]) { sfx.key(); sl.children[pos].innerHTML = sym(b.dataset.k, 34); b.style.visibility = "hidden"; pos++;
        if (pos === MEM.length) { sfx.right(); burstAt(sl, 20); setTimeout(() => win(lv), 600); } }
      else { fail(v, lv, sl); pal.innerHTML = ""; again.style.display = "block"; }
    });
  }
  again.onclick = round; round();
}

// 9 · Focos binarios (interactivo)
function n9(lv) {
  const vals = [16, 8, 4, 2, 1], on = [0, 0, 0, 0, 0];
  const v = frame(lv, "Los focos", "Soy programador, así que este es mi idioma. Enciende los focos que sumen exactamente 19.",
    `<p class="center" style="font-size:13px;color:var(--blush)">Toca un foco para encenderlo o apagarlo.</p><div class="glass" style="display:grid;grid-template-columns:minmax(0,1fr);gap:18px;padding:22px 14px"><div class="bulbs">${vals.map((n, i) => `<button class="bulb" data-i="${i}"><span class="g">${n}</span><span class="base"></span></button>`).join("")}</div>
     <div class="sum"><b id="s">0</b> <span>/ 19</span></div></div>`);
  const out = v.querySelector("#s");
  v.querySelectorAll(".bulb").forEach(b => b.onclick = () => {
    const i = +b.dataset.i; on[i] ^= 1; b.classList.toggle("on", !!on[i]);
    const s = vals.reduce((a, n, k) => a + n * on[k], 0); out.textContent = s;
    if (s === 19) { sfx.right(); v.querySelectorAll(".bulb").forEach(x => x.disabled = true); burstAt(out, 24); setTimeout(() => win(lv), 900); }
    else if (s > 19) fail(v, lv, out);
  });
}

/* ============================== final ============================== */
function completa() {
  const v = show(h(`<section class="view"><p class="eyebrow" style="margin-top:24px">Constelación completa</p>
    <div class="center" style="position:relative">${constellation(N, 260, false, true)}</div>
    <p class="sub" style="font-size:16.5px;color:#fff">Encendiste las 9 estrellas. Solo falta abrir el candado con tus 4 números secretos.</p>
    <div class="grow"></div><button class="btn" id="go">Ir al candado</button></section>`));
  burst(innerWidth / 2, 260, 40); sfx.good();
  v.querySelector("#go").onclick = () => { candado(); };
}

function candado() {
  let code = "";
  const got = CONFIG.nivelesConNumero.map(l => state.digits[l]).filter(Boolean);
  const v = show(h(`<section class="view" style="gap:16px"><div class="center" style="margin-top:14px">${padlock()}</div>
    <h2>El candado</h2><p class="sub">Escribe tus 4 números secretos, en el orden en que los ganaste.</p>
    <div class="slots4" id="sl">${"<div></div>".repeat(4)}</div><p class="hint"></p>
    <div class="keys">${[1, 2, 3, 4, 5, 6, 7, 8, 9, "⌫", 0, ""].map(k => k === "" ? "<span></span>" : `<button class="key" data-nosnd="1" data-k="${k}">${k}</button>`).join("")}</div></section>`));
  const sl = v.querySelector("#sl"), hint = v.querySelector(".hint");
  const draw = () => [...sl.children].forEach((d, i) => { d.textContent = code[i] ? "•" : ""; d.className = code[i] ? "f" : ""; });
  v.querySelectorAll(".key").forEach(b => b.onclick = () => {
    const k = b.dataset.k; sfx.key();
    if (k === "⌫") code = code.slice(0, -1); else if (code.length < 4) code += k;
    draw();
    if (code.length === 4) {
      if (fnv(code + "|check") === CHECK) { abierto(code); }
      else { sfx.bad(); sl.classList.remove("shake"); void sl.offsetWidth; sl.classList.add("shake");
        hint.innerHTML = got.length === 4 ? `<b>Código incorrecto.</b> Tus números fueron los de los niveles 2, 4, 6 y 8.` : `<b>Código incorrecto.</b> Son los números de los niveles 2, 4, 6 y 8.`;
        hint.classList.add("show"); setTimeout(() => { code = ""; draw(); }, 450); }
    }
  });
}

let S = null; // secreto descifrado
function abierto(code) {
  S = decrypt(code); sfx.open(); floatOn = true;
  const v = show(h(`<section class="view"><div class="center" style="margin-top:18px">${padlock()}</div>
    <p class="eyebrow">¡Candado abierto!</p><div class="big">${code}</div>
    <div class="glass center" style="display:grid;gap:8px">${S.candado.map((l, i) => `<p style="${i === 0 ? "font-weight:800" : "color:var(--blush);font-size:15px"}">${l}</p>`).join("")}
      <p class="quote" style="color:var(--gold);margin-top:6px">${S.frase}</p></div>
    <div class="grow"></div><button class="btn" id="go">Abrir mi regalo</button></section>`));
  requestAnimationFrame(() => setTimeout(() => v.querySelector(".lock").classList.add("open"), 200));
  burst(innerWidth / 2, 150, 30);
  v.querySelector("#go").onclick = () => { regalo(); };
}

function regalo() {
  let taps = 0;
  const v = show(h(`<section class="view"><p class="eyebrow" style="margin-top:40px">Tu premio</p><p class="sub" id="gh">Toca el regalo 3 veces para abrirlo</p>
    <div class="grow"></div>
    <button class="gift" id="g" data-nosnd="1" aria-label="Regalo"><svg width="220" height="220" viewBox="0 0 220 220">
      <rect x="30" y="90" width="160" height="120" rx="12" fill="#ff5a8f"/><rect x="18" y="68" width="184" height="40" rx="10" fill="#e23d74"/>
      <rect x="96" y="68" width="28" height="142" fill="${COL.gold}"/>
      <ellipse cx="80" cy="54" rx="34" ry="14" transform="rotate(25 80 54)" fill="${COL.gold}"/><ellipse cx="140" cy="54" rx="34" ry="14" transform="rotate(-25 140 54)" fill="${COL.gold}"/><circle cx="110" cy="64" r="12" fill="${COL.gold}"/></svg></button>
    <div class="grow"></div></section>`));
  const g = v.querySelector("#g");
  g.onclick = () => {
    taps++; g.classList.remove("hit"); void g.offsetWidth; g.classList.add("hit"); burstAt(g, 8 + taps * 8); sfx.pop(taps);
    v.querySelector("#gh").textContent = taps === 1 ? "¡Otra vez!" : taps === 2 ? "¡Una más!" : "";
    if (taps === 3) { sfx.good(); for (let i = 0; i < 4; i++) setTimeout(() => burst(Math.random() * innerWidth, Math.random() * innerHeight * .6, 22), i * 160); setTimeout(carta, 1200); }
  };
}

function carta() {
  const v = show(h(`<section class="view"><article class="letter"><p class="to">PARA ${CONFIG.nombre.toUpperCase()}</p><div class="txt typing" id="t"></div><p class="sign" id="sg">— ${S.firma}</p></article>
    <button class="seal" id="seal" aria-label="Sello secreto">${sym("heart", 26)}</button><p class="sealtxt" id="st">P.D. el sello esconde algo</p></section>`));
  const t = v.querySelector("#t"), txt = S.carta; let i = 0, timer;
  const finish = () => { clearInterval(timer); t.textContent = txt; t.classList.remove("typing"); v.querySelector("#sg").style.opacity = 1;
    v.querySelector("#seal").classList.add("show"); v.querySelector("#st").style.opacity = 1; };
  timer = setInterval(() => { t.textContent = txt.slice(0, ++i); if (i % 3 === 0 && txt[i - 1] !== " ") sfx.tick(); if (i >= txt.length) finish(); }, 38);
  v.querySelector(".letter").onclick = () => { if (t.classList.contains("typing")) finish(); };
  v.querySelector("#seal").onclick = e => { e.stopPropagation(); sfx.open(); pd(); };
}

function pd() {
  const v = show(h(`<section class="view"><p class="eyebrow" style="margin-top:40px">Secreto desbloqueado</p><div class="grow"></div>
    <div class="ticket"><p class="eyebrow" style="color:var(--muted)">${S.pd[0]}</p><h3>${S.pd[1]}<br>${S.pd[2]}</h3>${sym("heart", 32)}<br><small>${S.pd[3]}</small></div>
    <p class="sub" style="font-size:14px">Tómale captura para canjearlo.</p><div class="grow"></div>
    <button class="btn" id="h">Ver nuestra historia</button><button class="btn ghost" id="b">Volver a la carta</button></section>`));
  burstAt(v.querySelector(".ticket"), 24);
  v.querySelector("#h").onclick = historia; v.querySelector("#b").onclick = carta;
}

function historia() {
  const v = show(h(`<section class="view"><p class="eyebrow" style="margin-top:24px">Nuestra historia</p><h2>Nivel por nivel</h2>
    <div class="tl" style="margin-top:14px">${S.historia.map(([d, t, p], i) => `<div class="ev"><span class="dot">${sym(i === S.historia.length - 1 ? "heart" : "star", 20)}</span><p class="d">${d}</p><h4>${t}</h4><p>${p}</p></div>`).join("")}</div>
    <div class="grow"></div><button class="btn" id="c">Leer la carta otra vez</button><button class="btn ghost" id="r">Volver al inicio</button></section>`));
  v.querySelector("#c").onclick = carta; v.querySelector("#r").onclick = () => { floatOn = false; inicio(); };
}

inicio();
</script>
</body>
</html>
