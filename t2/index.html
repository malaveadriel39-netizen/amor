<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#120822">
<title>Los recuerdos perdidos</title>
<meta property="og:title" content="Julissa, alguien robó nuestros recuerdos">
<meta property="og:description" content="Misión: Mi Corazón · Temporada 2. 12 niveles, 4 capítulos y un ladrón por descubrir.">
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,600;0,9..144,700;1,9..144,400&family=Nunito:wght@400;600;800&family=JetBrains+Mono:wght@700&display=swap" rel="stylesheet">
<style>
:root{
  --night:#120822;--plum:#3b1240;--wine:#8a2b5e;--low:#c94a7e;
  --rose:#ff4f7e;--roseD:#c92f5d;--blush:#ffd6e1;--gold:#f5c16c;--goldD:#c9913a;
  --cream:#fff8f2;--ink:#2e0f2a;--muted:#8b6680;--ghost:#b99ab0;
  --sky:#6fb3ff;--lilac:#b58cff;--mint:#4fcf9a;--orange:#ff9a4d;
  --display:"Fraunces",Georgia,"Times New Roman",serif;
  --body:"Nunito","Segoe UI",system-ui,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;background:var(--night);overflow-x:hidden}
body{font-family:var(--body);color:#fff;background:linear-gradient(180deg,var(--night) 0%,var(--plum) 50%,var(--wine) 82%,var(--low) 100%) fixed;
  min-height:100dvh;overflow-x:hidden;user-select:none;-webkit-user-select:none}
#sky{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:0}
#app{position:relative;z-index:1;max-width:440px;margin:0 auto;min-height:100dvh;
  padding:calc(env(safe-area-inset-top,0px) + 18px) 18px calc(env(safe-area-inset-bottom,0px) + 24px);display:flex;flex-direction:column}
.view{display:flex;flex-direction:column;gap:18px;flex:1;animation:in .45s cubic-bezier(.2,.9,.3,1)}
@keyframes in{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
h1,h2{font-family:var(--display);font-weight:700;margin:0;text-wrap:balance;line-height:1.1}
h1{font-size:44px}h2{font-size:28px;text-align:center}
p{margin:0;line-height:1.5}
.sub{color:var(--blush);text-align:center;font-size:15.5px;text-wrap:balance}
.eyebrow{font-weight:800;font-size:11.5px;letter-spacing:.24em;text-transform:uppercase;color:var(--gold);text-align:center}
.center{text-align:center}.grow{flex:1}
.card{background:var(--cream);color:var(--ink);border-radius:22px;padding:22px}
.glass{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.1);border-radius:20px;padding:18px}
.btn{appearance:none;border:0;font:800 17px var(--body);color:#fff;background:var(--rose);border-radius:999px;padding:16px 28px;
  box-shadow:0 5px 0 var(--roseD),0 12px 26px rgba(255,79,126,.35);cursor:pointer;align-self:center;min-width:230px;transition:transform .08s}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 var(--roseD)}
.btn.ghost{background:transparent;border:1.5px solid rgba(255,255,255,.55);box-shadow:none}
.btn:focus-visible,.opt:focus-visible,.key:focus-visible{outline:3px solid var(--gold);outline-offset:3px}
.opts{display:flex;flex-direction:column;gap:12px}
.opts.row{flex-direction:row;justify-content:space-between}
.opts.row .opt{flex:1}
.opt{appearance:none;border:0;background:var(--blush);color:var(--ink);font:800 18px var(--body);border-radius:16px;padding:18px 14px;cursor:pointer;
  display:flex;align-items:center;justify-content:center;gap:8px;min-height:60px;transition:transform .1s,background .2s}
.opt:active{transform:scale(.97)}
.opt.good{background:var(--gold)}
.opt.white{background:var(--cream)}
.shake{animation:shake .45s}
@keyframes shake{20%{transform:translateX(-9px)}40%{transform:translateX(8px)}60%{transform:translateX(-6px)}80%{transform:translateX(4px)}}
.hint{min-height:44px;text-align:center;color:var(--blush);font-size:14.5px;opacity:0;transition:opacity .3s}
.hint.show{opacity:1}
.hint b{color:var(--gold)}
/* HUD */
.hud{display:grid;grid-template-columns:1fr auto;align-items:center;gap:8px 12px}
.hud .lvl{font-weight:800;font-size:11px;letter-spacing:.22em;color:var(--blush)}
.bar{grid-column:1/-1;display:flex;gap:5px}
.bar i{flex:1;height:5px;border-radius:3px;background:rgba(255,255,255,.18);transition:background .4s}
.bar i.on{background:var(--gold)}
#mute{position:fixed;right:max(12px,calc(50% - 220px + 12px));bottom:calc(env(safe-area-inset-bottom,0px) + 12px);z-index:5;width:40px;height:40px;border-radius:50%;
  border:1px solid rgba(255,255,255,.25);background:rgba(18,8,34,.5);color:#fff;display:grid;place-items:center;cursor:pointer}
/* Constelación */
.const line{stroke-linecap:round}
.const .lit{animation:pop .7s cubic-bezier(.2,1.6,.4,1) both}
@keyframes pop{from{transform:scale(0);opacity:0}to{transform:scale(1);opacity:1}}
/* Nivel 1 */
.game{position:relative;border-radius:20px;overflow:hidden;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);touch-action:none}
.game canvas{display:block;width:100%;height:100%}
.gstats{display:flex;justify-content:space-between;font-weight:800;font-size:15px}
.overlay{position:absolute;inset:0;display:grid;place-items:center;background:rgba(18,8,34,.72);text-align:center;padding:20px;gap:12px}
/* símbolos */
.seq{display:flex;align-items:center;justify-content:space-between;gap:4px}
.qbox{width:52px;height:56px;border:2px dashed var(--gold);border-radius:12px;display:grid;place-items:center;font:700 28px var(--display);color:var(--gold)}
.keygrid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px 6px}
.keygrid div{display:flex;align-items:center;gap:6px;font:700 18px var(--mono);color:var(--ink)}
.msg{display:flex;justify-content:center;gap:12px;align-items:center}
.msg .sp{width:14px}
/* memoria */
.slots{display:flex;justify-content:center;gap:10px}
.slot{width:54px;height:54px;border-radius:14px;background:rgba(255,255,255,.1);display:grid;place-items:center}
.timer{height:5px;border-radius:3px;background:var(--gold);transform-origin:left}
/* focos */
.bulbs{display:flex;justify-content:space-between;gap:4px}
.bulb{flex:1;min-width:0;appearance:none;border:0;background:none;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:6px;color:#fff;font:inherit}
.bulb .g{width:46px;height:46px;border-radius:50%;background:#5a3a5c;display:grid;place-items:center;font:700 17px var(--mono);transition:all .25s}
.bulb.on .g{background:var(--gold);color:var(--ink);box-shadow:0 0 0 6px rgba(245,193,108,.2),0 0 24px rgba(245,193,108,.55)}
.bulb .base{width:22px;height:12px;border-radius:2px 2px 6px 6px;background:#9a8aa0;margin-top:-6px}
.bulb small{font-weight:800;font-size:8.5px;letter-spacing:.04em;color:var(--ghost)}
.bulb.on small{color:var(--gold)}
.sum{font:700 40px var(--mono);text-align:center}
.sum span{color:var(--ghost);font-size:22px}
/* éxito */
.digit{align-self:center;text-align:center;padding:16px 38px}
.digit .n{font:700 46px var(--mono);color:var(--rose);line-height:1.1}
.digit .l{font-weight:800;font-size:10.5px;letter-spacing:.2em;color:var(--muted)}
.quote{font-family:var(--display);font-style:italic;font-size:18px;color:var(--blush);text-align:center;text-wrap:balance}
/* candado */
.slots4{display:flex;justify-content:center;gap:12px}
.slots4 div{width:52px;height:60px;border-radius:12px;background:rgba(255,255,255,.12);display:grid;place-items:center;font:700 28px var(--mono)}
.slots4 div.f{background:var(--cream);color:var(--ink)}
.keys{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.key{appearance:none;border:0;border-radius:16px;background:rgba(255,255,255,.12);color:#fff;font:700 24px var(--mono);height:62px;cursor:pointer}
.key:active{background:rgba(255,255,255,.24)}
.lock .shackle{transition:transform .6s cubic-bezier(.3,1.6,.5,1)}
.lock.open .shackle{transform:translateY(-16px)}
.big{font:700 72px var(--mono);text-align:center;letter-spacing:.06em}
/* regalo */
.gift{align-self:center;cursor:pointer;background:none;border:0;padding:0;animation:float 2.4s ease-in-out infinite}
.gift.hit{animation:wobble .45s}
@keyframes float{50%{transform:translateY(-10px)}}
@keyframes wobble{25%{transform:rotate(-10deg) scale(1.06)}50%{transform:rotate(8deg) scale(1.1)}75%{transform:rotate(-4deg)}}
/* carta */
.letter{background:var(--cream);color:var(--ink);border-radius:10px;padding:26px 22px 22px;
  background-image:repeating-linear-gradient(transparent 0 30px,#f2d3dc 30px 31px);background-position:0 18px;box-shadow:0 20px 50px rgba(0,0,0,.4);
  animation:unfold .9s cubic-bezier(.2,1.1,.3,1)}
@keyframes unfold{from{transform:scaleY(.05) translateY(120px);opacity:0}to{transform:none;opacity:1}}
.letter .to{font-weight:800;font-size:10.5px;letter-spacing:.24em;color:var(--muted);text-align:center;margin-bottom:10px}
.letter .txt{font-family:var(--display);font-style:italic;font-size:17px;line-height:31px;white-space:pre-wrap;min-height:300px}
.letter .txt.typing::after{content:"|";color:var(--rose);animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.letter .sign{font-family:var(--display);font-style:italic;font-size:22px;color:var(--rose);text-align:right;opacity:0;transition:opacity 1s}
.seal{appearance:none;border:0;align-self:center;width:64px;height:64px;border-radius:50%;background:radial-gradient(circle,#9a1f44 0 58%,#b3264f 60%);
  display:grid;place-items:center;cursor:pointer;box-shadow:0 4px 12px rgba(0,0,0,.3);opacity:0;transform:scale(.6);transition:all .5s}
.seal.show{opacity:1;transform:none}
.sealtxt{font-size:12px;color:var(--muted);text-align:center;opacity:0;transition:opacity .5s}
.ticket{position:relative;background:var(--cream);color:var(--ink);border-radius:18px;padding:34px 24px;text-align:center}
.ticket::before{content:"";position:absolute;inset:12px;border:1.5px dashed var(--rose);border-radius:10px;pointer-events:none}
.ticket h3{font:700 22px/1.3 var(--display);margin:10px 0 14px;text-wrap:balance}
.ticket small{font-family:var(--display);font-style:italic;color:var(--muted);font-size:14px}
.tl{position:relative;display:flex;flex-direction:column;gap:30px;padding-left:44px}
.tl::before{content:"";position:absolute;left:15px;top:8px;bottom:8px;width:2px;background:rgba(245,193,108,.5)}
.tl .ev{position:relative}
.tl .dot{position:absolute;left:-44px;top:0;width:32px;height:32px;border-radius:50%;background:var(--plum);display:grid;place-items:center}
.tl .d{font-weight:800;font-size:11px;letter-spacing:.2em;color:var(--gold)}
.tl h4{font:700 20px var(--display);margin:4px 0}
.tl p{color:var(--blush);font-size:15px}

/* rompecabezas */
.puz-ref{display:flex;align-items:center;gap:12px;align-self:center;font-size:13.5px;color:var(--blush)}
.puz-ref img{width:66px;height:66px;border-radius:12px;object-fit:cover;border:2px solid rgba(255,255,255,.35)}
.puz{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;width:100%;max-width:370px;aspect-ratio:1;align-self:center;border-radius:18px;overflow:hidden;transition:gap .5s,box-shadow .5s}
.puz.solved{gap:0;box-shadow:0 0 0 4px var(--gold),0 0 40px rgba(245,193,108,.5)}
.tile{appearance:none;border:0;padding:0;background-size:300% 300%;cursor:pointer;position:relative;transition:transform .18s,filter .18s}
.tile.sel{transform:scale(.9);filter:brightness(1.15);box-shadow:inset 0 0 0 3px var(--gold);z-index:1}
.tile.ok::after{content:"";position:absolute;right:5px;top:5px;width:8px;height:8px;border-radius:50%;background:var(--mint);box-shadow:0 0 0 2px rgba(0,0,0,.25)}
.puz.solved .tile::after{display:none}
/* galería */
.gal{display:flex;gap:18px;overflow-x:auto;scroll-snap-type:x mandatory;padding:14px 11% 24px;margin:0 -18px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.gal::-webkit-scrollbar{display:none}
.pol{flex:0 0 78%;scroll-snap-align:center;background:#fffdf9;padding:10px 10px 12px;border-radius:4px;box-shadow:0 16px 34px rgba(0,0,0,.45);transform:rotate(var(--r));margin:0}
.pol img{width:100%;aspect-ratio:4/5;object-fit:cover;display:block;background:#ddd}
.pol figcaption{font:italic 400 19px var(--display);color:var(--ink);text-align:center;margin-top:10px}
.dots{display:flex;justify-content:center;gap:7px}.dots i{width:7px;height:7px;border-radius:50%;background:rgba(255,255,255,.3);transition:all .3s}.dots i.on{background:var(--gold);width:20px;border-radius:4px}
.tl .ph{margin-top:10px;width:100%;max-width:250px;border-radius:12px;display:block;box-shadow:0 8px 20px rgba(0,0,0,.35)}
/* player 2 */
.p2{position:relative;height:230px}
.p2 #si{position:absolute;left:50%;top:30px;transform:translateX(-50%) scale(var(--s,1));transition:transform .3s;min-width:160px}
.p2 #no{position:absolute;left:50%;top:130px;transform:translateX(-50%);min-width:120px;transition:left .25s,top .25s}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stat{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.1);border-radius:16px;padding:14px 6px;text-align:center}
.stat b{display:block;font:700 26px var(--mono);color:var(--gold)}.stat span{font-weight:800;font-size:10.5px;letter-spacing:.16em;color:var(--blush)}
.aj{font:700 54px var(--display);text-align:center;letter-spacing:.04em}.aj i{font-style:normal;color:var(--rose)}
.burst{position:fixed;pointer-events:none;z-index:9;will-change:transform,opacity}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}
/* ===== Temporada 2 ===== */
.topbar{display:flex;align-items:center;justify-content:space-between;gap:8px}
.back{appearance:none;border:1px solid rgba(255,255,255,.25);background:rgba(255,255,255,.06);color:#fff;border-radius:999px;padding:8px 14px;font:800 13px var(--body);cursor:pointer}
.chip{font-weight:800;font-size:11px;letter-spacing:.2em;color:var(--blush);text-transform:uppercase}
.story{font:600 23px/1.4 var(--display);text-align:center;text-wrap:balance;min-height:130px}
.story.typing::after,.typing::after{content:"|";color:var(--rose);animation:blink 1s steps(1) infinite}
.thief-hero svg{filter:drop-shadow(0 18px 30px rgba(0,0,0,.5));animation:float 3s ease-in-out infinite}
.note{position:relative;background:#fff6e2;color:#3a2a20;border-radius:6px;padding:26px 22px 18px;font:italic 400 19px/1.5 var(--display);box-shadow:0 18px 40px rgba(0,0,0,.45);transform:rotate(-1.4deg);text-wrap:pretty}
.note::before{content:"";position:absolute;top:-12px;left:50%;width:110px;height:26px;transform:translateX(-50%) rotate(2deg);background:rgba(255,214,225,.75);border-radius:2px}
.note .sig{text-align:right;font:800 12.5px var(--body);letter-spacing:.2em;margin-top:12px;color:#8a2b5e}
.obj{display:flex;gap:14px;align-items:center}.obj .oi{flex:none}
.tbar{height:6px;border-radius:3px;background:rgba(255,255,255,.15);overflow:hidden}.tbar.big{height:8px}
.tbar i{display:block;height:100%;background:linear-gradient(90deg,var(--rose),var(--gold));transform-origin:left;transition:transform .6s}
.cap{display:grid;gap:8px}.cap h3{font:700 22px var(--display);margin:0}.capd{color:var(--blush);font-size:14px}
.nodes{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:4px}
.node{appearance:none;border:1px solid rgba(255,255,255,.12);background:rgba(255,255,255,.07);border-radius:16px;color:#fff;padding:14px 6px 12px;display:flex;flex-direction:column;align-items:center;gap:8px;cursor:pointer;font:700 12.5px/1.25 var(--body);text-align:center;min-height:112px}
.node .num{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;font:700 17px var(--mono);background:rgba(255,255,255,.14)}
.node.done .num{background:var(--gold);color:var(--ink)}
.node.cur{border-color:var(--rose);animation:glow 1.8s ease-in-out infinite}
.node.cur .num{background:var(--rose)}
@keyframes glow{0%,100%{box-shadow:0 0 0 1px rgba(255,79,126,.3),0 0 16px rgba(255,79,126,.25)}50%{box-shadow:0 0 0 2px rgba(255,79,126,.6),0 0 30px rgba(255,79,126,.5)}}
.node.lock{opacity:.42;cursor:default}
.core-node{appearance:none;display:flex;gap:14px;align-items:center;text-align:left;width:100%;border-radius:18px;padding:16px;border:1.5px dashed rgba(245,193,108,.6);background:rgba(245,193,108,.08);color:#fff;font:600 14px var(--body);cursor:pointer}
.core-node b{font:700 18px var(--display)}.core-node small{color:var(--blush)}
.core-node.cur{animation:glow 1.8s ease-in-out infinite;border-style:solid}.core-node.done{border-style:solid;border-color:var(--gold)}.core-node.lock{opacity:.45;cursor:default}
.bolt{flex:none;width:48px;height:48px;border-radius:50%;display:grid;place-items:center;background:rgba(245,193,108,.15)}
.game .overlay p{font-size:15px;line-height:1.45}
.mem{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.mc{appearance:none;border:0;padding:0;background:none;aspect-ratio:3/4;position:relative;perspective:700px;cursor:pointer}
.mc span{position:absolute;inset:0;border-radius:10px;backface-visibility:hidden;-webkit-backface-visibility:hidden;transition:transform .45s;display:grid;place-items:center}
.mc .back{background:linear-gradient(135deg,#6a2266,#3b1240);border:1px solid rgba(255,255,255,.18)}
.mc .front{background-size:cover;background-position:center 30%;transform:rotateY(180deg);border:2px solid #fff}
.mc.on .back{transform:rotateY(180deg)}.mc.on .front{transform:rotateY(360deg)}
.mc.ok .front{border-color:var(--gold);box-shadow:0 0 16px rgba(245,193,108,.7)}
.detw{position:relative}.dl{position:absolute;left:10px;top:8px;z-index:1;font:800 10px var(--body);letter-spacing:.16em;background:rgba(18,8,34,.7);padding:4px 8px;border-radius:6px}
.det{width:100%;border-radius:14px;display:block;touch-action:manipulation}
.whack{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.wn{appearance:none;aspect-ratio:1;border-radius:16px;border:2px solid rgba(245,193,108,.35);background:linear-gradient(#2c1644,#170826);position:relative;overflow:hidden;cursor:pointer;padding:0}
.wn::after{content:"";position:absolute;left:0;right:0;bottom:0;height:22%;background:#3b1240;border-top:2px solid rgba(245,193,108,.35)}
.wn .who{position:absolute;inset:0;display:grid;place-items:center;transform:translateY(105%);transition:transform .13s ease-out}
.wn.up .who{transform:translateY(4%)}
.simon{display:grid;grid-template-columns:1fr 1fr;gap:14px;max-width:340px;width:100%;align-self:center}
.sb{appearance:none;border:0;aspect-ratio:1;border-radius:24px;background:rgba(255,255,255,.07);display:grid;place-items:center;cursor:pointer;transition:background .12s,box-shadow .12s}
.sb svg{opacity:.5;transition:opacity .12s,transform .12s}
.sb.lit{background:rgba(255,255,255,.22);box-shadow:0 0 34px var(--c)}.sb.lit svg{opacity:1;transform:scale(1.18)}
.dpad{display:grid;grid-template-columns:repeat(3,62px);grid-template-rows:repeat(2,50px);gap:6px;justify-content:center}
.dpad button{appearance:none;border:0;border-radius:12px;background:rgba(255,255,255,.13);color:#fff;font:700 18px var(--mono);cursor:pointer}
.dpad button:active{background:rgba(255,255,255,.3)}
.pola{background:#fffdf9;padding:12px 12px 10px;border-radius:4px;box-shadow:0 18px 40px rgba(0,0,0,.45);transform:rotate(-2deg);align-self:center;width:min(76%,290px);margin:0}
.pola img{width:100%;aspect-ratio:4/5;object-fit:cover;display:block;animation:develop 2.8s ease-out both;background:#ddd}
@keyframes develop{from{filter:blur(16px) sepia(1) brightness(1.7);opacity:.2}to{filter:none;opacity:1}}
.pola p{font:italic 18px var(--display);color:var(--ink);text-align:center;margin-top:8px}
.clue{display:flex;gap:12px;align-items:flex-start;background:rgba(245,193,108,.1);border:1px dashed rgba(245,193,108,.65);border-radius:16px;padding:14px 16px}
.clue b{font:700 12px var(--mono);color:var(--gold);letter-spacing:.12em}.clue p{margin-top:4px;font-size:15.5px}
.diary{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.diary li{display:flex;gap:12px;background:rgba(255,255,255,.07);border-radius:14px;padding:12px 14px;font-size:15px}
.diary li b{font:700 13px var(--mono);color:var(--gold);min-width:28px}.diary li.no{opacity:.45}
.cl{margin:0;padding-left:20px;display:grid;gap:4px;font-size:13.5px;color:var(--blush)}
.core{position:relative;width:190px;height:190px;align-self:center}
.core svg{width:100%;height:100%;overflow:visible}
.core.full svg{filter:drop-shadow(0 0 18px rgba(245,193,108,.8));animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.04)}}
.core-in{position:absolute;inset:0;display:grid;place-content:center;text-align:center}
.core-in span{font:700 40px var(--mono)}.core-in small{font-weight:800;font-size:10.5px;letter-spacing:.2em;color:var(--blush)}
.slots2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.eslotw{display:grid;gap:6px}
.eslot{appearance:none;border:2px dashed rgba(255,255,255,.3);background:rgba(255,255,255,.05);border-radius:16px;aspect-ratio:1;color:var(--blush);display:grid;place-items:center;text-align:center;font:700 13px/1.35 var(--body);cursor:pointer;padding:10px;position:relative;overflow:hidden}
.eslot small{font-weight:600;font-size:11px;opacity:.8}
.eslot img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.eslot.full{border:2px solid var(--gold);box-shadow:0 0 18px rgba(245,193,108,.35)}
.elabel{width:100%;box-sizing:border-box;border-radius:10px;border:1px solid rgba(255,255,255,.2);background:rgba(255,255,255,.08);color:#fff;font:600 13px var(--body);padding:8px 10px;user-select:text;-webkit-user-select:text}
.suspects{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.sus{appearance:none;border:0;background:var(--cream);color:var(--ink);border-radius:16px;padding:14px 8px;display:grid;justify-items:center;gap:4px;font:800 16px var(--body);cursor:pointer}
.sus small{font-weight:600;font-size:12px;color:var(--muted);line-height:1.3}
.sus.pick{box-shadow:0 0 0 4px var(--gold),0 0 30px rgba(245,193,108,.6)}
.modal{position:fixed;inset:0;background:rgba(10,4,20,.72);display:grid;place-items:center;z-index:20;padding:20px;animation:in .3s}
.modal .card{max-width:360px;width:100%;text-align:center;display:grid;gap:12px;justify-items:center}
.modal .btn{width:100%;min-width:0}
.btn.ghost.ink{color:var(--ink);border-color:rgba(46,15,42,.35)}
.unmask{position:relative;width:220px;height:220px;align-self:center;border-radius:50%;overflow:hidden;box-shadow:0 0 0 5px var(--gold),0 20px 50px rgba(0,0,0,.5)}
.unmask img{width:100%;height:100%;object-fit:cover}
.unmask .mask{position:absolute;inset:0;display:grid;place-items:center;background:#2a1030;transition:transform 1.1s cubic-bezier(.5,-.3,.6,1),opacity 1.1s}
.unmask .mask.off{transform:translateY(-120%) rotate(-25deg);opacity:0}
@keyframes float{50%{transform:translateY(-10px)}}
</style>

/* Cifrado ligero: FNV-1a + keystream mulberry32 (mismo algoritmo en build.py) */
function fnv(str) { let x = 0x811c9dc5; for (const b of new TextEncoder().encode(str)) { x ^= b; x = Math.imul(x, 16777619) >>> 0; } return x >>> 0; }
function mulberry32(a) { return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) >>> 24; }; }
function decrypt(code) {
  const raw = Uint8Array.from(atob(SECRETO), c => c.charCodeAt(0)); const next = mulberry32(fnv(code + "|mmc"));
  return JSON.parse(new TextDecoder().decode(raw.map(b => b ^ next())));
}

/* ============================== sonido ==============================
   Web Audio sintetizado (sin archivos). En iPhone el audio web se silencia con el
   interruptor de silencio: por eso se pide la sesión de audio "playback" y se
   desbloquea el contexto en el primer toque. */
let muted = (() => { try { return localStorage.getItem("mmc-mute") === "1"; } catch { return false; } })();
let actx = null, master = null;
function audio() {
  if (!actx) {
    const AC = window.AudioContext || window.webkitAudioContext; if (!AC) return null;
    actx = new AC();
    const comp = actx.createDynamicsCompressor(); comp.threshold.value = -12; comp.ratio.value = 4;
    master = actx.createGain(); master.gain.value = .9; master.connect(comp).connect(actx.destination);
  }
  if (actx.state !== "running") actx.resume().catch(() => {});
  return actx;
}
let unlocked = false;
function unlockAudio() {
  if (unlocked) return; unlocked = true;
  try { if (navigator.audioSession) navigator.audioSession.type = "playback"; } catch {}
  const c = audio(); if (!c) return;
  const buf = c.createBuffer(1, 1, 22050), src = c.createBufferSource(); src.buffer = buf; src.connect(c.destination); src.start(0);
  // iOS < 17: un <audio> silencioso cambia la sesión a "reproducción" e ignora el interruptor
  try { const el = new Audio("data:audio/wav;base64,UklGRiQAAABXQVZFZm10IBAAAAABAAEAQB8AAEAfAAABAAgAZGF0YQAAAAA="); el.loop = true; el.volume = 0; el.setAttribute("playsinline", ""); el.play().catch(() => {}); } catch {}
}
["pointerdown", "touchend", "keydown"].forEach(ev => addEventListener(ev, unlockAudio, { passive: true }));

/* nota con envolvente y barrido opcional de frecuencia */
function tone(freq, dur = .12, type = "sine", vol = .2, delay = 0, to = null) {
  if (muted) return;
  const c = audio(); if (!c) return;
  try {
    const t = c.currentTime + .01 + delay, o = c.createOscillator(), g = c.createGain();
    o.type = type; o.frequency.setValueAtTime(freq, t); if (to) o.frequency.exponentialRampToValueAtTime(to, t + dur);
    g.gain.setValueAtTime(.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + .012); g.gain.exponentialRampToValueAtTime(.0001, t + dur);
    o.connect(g).connect(master); o.start(t); o.stop(t + dur + .05);
  } catch {}
}
const bell = (f, d = 0, v = .22) => { tone(f, .5, "sine", v, d); tone(f * 2, .3, "sine", v * .35, d); tone(f * 3, .18, "triangle", v * .12, d); };
const PENTA = [523, 587, 659, 784, 880, 1047, 1175, 1319];
const sfx = {
  tap:   () => tone(420, .07, "sine", .22, 0, 720),                                   // "pop" al tocar un botón
  key:   () => tone(880, .05, "square", .06),                                         // teclado del candado
  right: () => { bell(784); bell(1175, .09); },                                       // respuesta correcta
  good:  () => [523, 659, 784, 1047, 1319].forEach((f, i) => bell(f, i * .085, .2)),   // nivel superado
  bad:   () => { tone(260, .16, "square", .09, 0, 150); tone(180, .22, "square", .08, .12, 110); }, // error
  catch: () => bell(PENTA[Math.random() * PENTA.length | 0], 0, .16),                 // atrapar corazón
  hurt:  () => tone(300, .25, "sawtooth", .1, 0, 90),                                 // corazón roto
  open:  () => { [392, 523, 659, 784, 1047].forEach((f, i) => bell(f, i * .12, .22)); tone(2093, .8, "sine", .05, .6); }, // candado abierto
  pop:   (n) => tone(300 + n * 160, .16, "triangle", .2, 0, 600 + n * 200),          // tocar el regalo
  tick:  () => tone(1600 + Math.random() * 300, .018, "square", .018),               // máquina de escribir
};
/* sonido automático para cualquier botón */
document.addEventListener("pointerdown", e => { const b = e.target.closest("button"); if (b && !b.disabled && b.id !== "mute" && !b.dataset.nosnd) sfx.tap(); });

// Constelación en forma de corazón (9 estrellas; el vértice 5 es la hendidura)
const V = [[0, -1], [-.55, -.42], [-.97, .12], [-.86, .7], [-.42, .92], [0, .52], [.42, .92], [.86, .7], [.97, .12], [.55, -.42]];
const STARS = [0, 1, 2, 3, 4, 6, 7, 8, 9];
function constellation(lit, size = 200, animateLast = false, heartFill = false) {
  const s = 100, pts = V.map(([x, y]) => [120 + x * s, 115 - y * s]);
  const on = v => v === 5 ? lit >= 6 : STARS.indexOf(v) < lit;
  let g = "";
  if (heartFill) g += `<path d="${HEART_D}" transform="translate(60 52) scale(5)" fill="${COL.rose}" opacity=".95"/>`;
  pts.forEach((p, i) => { const q = pts[(i + 1) % pts.length], l = on(i) && on((i + 1) % pts.length);
    g += `<line x1="${p[0]}" y1="${p[1]}" x2="${q[0]}" y2="${q[1]}" stroke="${l ? COL.gold : "#fff"}" stroke-opacity="${l ? .9 : .25}" stroke-width="${l ? 2.5 : 1.5}" ${l ? "" : 'stroke-dasharray="4 5"'}/>`; });
  STARS.forEach((v, n) => { const [x, y] = pts[v];
    if (n < lit) { const cls = animateLast && n === lit - 1 ? ' class="lit"' : "";
      g += `<g${cls} style="transform-origin:${x}px ${y}px"><circle cx="${x}" cy="${y}" r="15" fill="${COL.gold}" opacity=".22"/><polygon points="${starPts(x, y, 10)}" fill="${COL.gold}"/></g>`; }
    else g += `<circle cx="${x}" cy="${y}" r="3.2" fill="#fff" opacity=".5"/>`; });
  return `<svg class="const" viewBox="0 0 240 240" width="${size}" height="${size}" style="overflow:visible">${g}</svg>`;
}

function heartAt(c, x, y, s, col, rot = 0) { c.save(); c.translate(x, y); c.rotate(rot); c.translate(-s / 2, -s / 2); c.scale(s / 24, s / 24); c.fillStyle = col; c.fill(HP); c.restore(); }

function starAt(c, x, y, r, col) { c.beginPath(); for (let i = 0; i < 10; i++) { const a = -Math.PI / 2 + i * Math.PI / 5, rr = i % 2 ? r * .45 : r; c.lineTo(x + rr * Math.cos(a), y + rr * Math.sin(a)); } c.closePath(); c.fillStyle = col; c.fill(); }

function cover(c, img, x, y, w, h) {

  const ir = img.naturalWidth / img.naturalHeight, r = w / h; let sw, sh, sx, sy;
  if (ir > r) { sh = img.naturalHeight; sw = sh * r; sx = (img.naturalWidth - sw) / 2; sy = 0; } else { sw = img.naturalWidth; sh = sw / r; sx = 0; sy = (img.naturalHeight - sh) / 2.6; }
  c.drawImage(img, sx, sy, sw, sh, x, y, w, h);

const LOCK = `<svg width="16" height="18" viewBox="0 0 100 110"><path d="M26 52V34a24 24 0 0 1 48 0v18" fill="none" stroke="#fff" stroke-width="12"/><rect x="10" y="48" width="80" height="58" rx="12" fill="#fff"/></svg>`;

/* ---------- motor arcade compartido ---------- */
function arcade(lv, cfg) {
  const L = LV[lv - 1];
  const v = levelFrame(lv, `<div class="gstats"><span id="hl"></span><span id="hr"></span></div>
    <div class="game" style="height:${cfg.h}"><canvas></canvas><div class="overlay" id="ov"></div></div>${cfg.extra || ""}`);
  const box = $(v, ".game"), cv = $(box, "canvas"), c = cv.getContext("2d"), ov = $(v, "#ov"), HL = $(v, "#hl"), HR = $(v, "#hr");
  const g = { lv, v, c, cv, keys: {}, run: false, t: 0, lives: 3, score: 0, inv: 0, easy: !!state.easy[lv] };
  const d = Math.min(devicePixelRatio || 1, 2); g.W = box.clientWidth; g.H = box.clientHeight; cv.width = g.W * d; cv.height = g.H * d; c.setTransform(d, 0, 0, d, 0, 0); g.dpr = d;
  const pos = e => { const r = cv.getBoundingClientRect(); return [e.clientX - r.left, e.clientY - r.top]; };
  cv.addEventListener("pointerdown", e => { if (!g.run) return; e.preventDefault(); try { cv.setPointerCapture(e.pointerId); } catch {} g.down = true; cfg.down && cfg.down(g, ...pos(e)); });

  const ku = e => { g.keys[e.key] = false; };
  addEventListener("keydown", kd); addEventListener("keyup", ku);
  let hl = "", hr = "";
  const hud = () => { const a = cfg.hud ? cfg.hud(g) : "", b = cfg.noLives ? "" : hearts(g.lives); if (a !== hl) HL.innerHTML = hl = a; if (b !== hr) HR.innerHTML = hr = b; };
  g.hurt = () => { if (g.inv > 0 || !g.run) return; g.lives--; g.inv = 1.4; sfx.hurt(); navigator.vibrate && navigator.vibrate(60); if (g.lives <= 0) g.lose(); };
  g.win = () => { if (!g.run) return; g.run = false; sfx.right(); const r = cv.getBoundingClientRect(); burst(r.left + r.width / 2, r.top + r.height / 2, 34); setTimeout(() => completar(lv), 1100); };
  g.lose = () => { g.run = false; setTimeout(() => perder(lv, start), 350); };
  let last = 0;
  function start() { g.lives = 3; g.score = 0; g.t = 0; g.inv = 0; g.easy = !!state.easy[lv]; cfg.init(g); g.run = true; ov.style.display = "none"; last = performance.now(); requestAnimationFrame(loop); }

  $(ov, "#play").onclick = start;
  cfg.init(g); cfg.draw(g, c); hud();
  g.start = start;
  return g;
}

/* =====================================================================
   1 · LLUVIA DE CORAZONES (canasta 2.0 con poderes)
   ===================================================================== */
function gCanasta(lv) {
  const POW = [{ id: "iman", name: "IMÁN", col: COL.sky, l: "M" }, { id: "escudo", name: "ESCUDO", col: COL.mint, l: "E" }, { id: "lento", name: "LENTO", col: COL.lilac, l: "L" }];
  const goal = g => g.easy ? 10 : 15;
  arcade(lv, {
    h: "min(54dvh,450px)",
    hud: g => `${sym("heart", 16)} ${g.score}/${goal(g)}${g.pw ? ` · <b style="color:${g.pw.col}">${g.pw.name} ${Math.ceil(g.pw.t)}s</b>` : ""}`,
    init(g) { g.items = []; g.px = g.tx = g.W / 2; g.spawn = .5; g.pw = null; },
    down(g, x) { g.tx = x; }, move(g, x) { g.tx = x; },
    update(g, dt) {
      const k = g.keys, dir = (k.ArrowRight ? 1 : 0) - (k.ArrowLeft ? 1 : 0);
      if (dir) g.tx += dir * 440 * dt;
      g.tx = Math.max(40, Math.min(g.W - 40, g.tx)); g.px += (g.tx - g.px) * Math.min(1, dt * 14);
      if (g.pw && (g.pw.t -= dt) <= 0) g.pw = null;
      const slow = g.pw && g.pw.id === "lento" ? .45 : 1, prog = g.score / goal(g);
      if ((g.spawn -= dt) <= 0) {
        const r = Math.random(), badP = g.easy ? .1 : .16 + prog * .1;
        const type = r < badP ? "bad" : r < badP + .07 ? "pow" : r < badP + .17 ? "gold" : "heart";
        g.items.push({ x: 26 + Math.random() * (g.W - 52), y: -20, v: (130 + Math.random() * 90) * (1 + prog * .7) * (g.easy ? .8 : 1), type, a: 0, r: (Math.random() - .5) * 2, p: type === "pow" ? POW[Math.random() * 3 | 0] : null });
        g.spawn = (g.easy ? .85 : .7) - prog * .25;
      }
      const by = g.H - 34, R = g.cv.getBoundingClientRect();
      for (const it of g.items) {
        it.y += it.v * slow * dt; it.a += it.r * dt;
        if (g.pw && g.pw.id === "iman" && (it.type === "heart" || it.type === "gold") && it.y > g.H * .35) it.x += (g.px - it.x) * Math.min(1, dt * 3.5);
        if (!it.hit && Math.abs(it.x - g.px) < 42 && Math.abs(it.y - by) < 24) {

          if (it.type === "bad") { if (g.pw && g.pw.id === "escudo") { g.pw = null; sfx.key(); burst(R.left + it.x, R.top + it.y, 6); } else g.hurt(); }
          else if (it.type === "pow") { g.pw = Object.assign({}, it.p, { t: 6 }); sfx.right(); }
          else { g.score += it.type === "gold" ? 2 : 1; sfx.catch(); burst(R.left + it.x, R.top + it.y, 4); }
        }
      }
      g.items = g.items.filter(i => !i.hit && i.y < g.H + 30);
      if (g.score >= goal(g)) g.win();
    },
    draw(g, c) {
      for (const it of g.items) {
        if (it.type === "pow") { c.fillStyle = it.p.col; c.shadowColor = it.p.col; c.shadowBlur = 14; c.beginPath(); c.arc(it.x, it.y, 15, 0, TAU); c.fill(); c.shadowBlur = 0; c.fillStyle = "#fff"; c.font = "800 15px Nunito, sans-serif"; c.textAlign = "center"; c.textBaseline = "middle"; c.fillText(it.p.l, it.x, it.y + 1); continue; }
        heartAt(c, it.x, it.y, 30, it.type === "bad" ? COL.ghost : it.type === "gold" ? COL.gold : COL.rose, it.a);
        if (it.type === "bad") crack(c, it.x, it.y, 30, it.a);
      }
      const y = g.H - 34;
      if (g.pw && g.pw.id === "iman") { c.strokeStyle = COL.sky; c.globalAlpha = .35 + .25 * Math.sin(g.t * 8); c.lineWidth = 2; c.beginPath(); c.arc(g.px, y, 70, Math.PI, 0); c.stroke(); c.globalAlpha = 1; }
      if (g.inv > 0 && (g.t * 10 | 0) % 2) c.globalAlpha = .4;
      basket(c, g.px, y); c.globalAlpha = 1;
      if (g.pw && g.pw.id === "escudo") { c.strokeStyle = COL.mint; c.lineWidth = 3; c.globalAlpha = .75; c.beginPath(); c.arc(g.px, y + 4, 50, Math.PI, 0); c.stroke(); c.globalAlpha = 1; }
    }
  });
}

    <div class="mem" style="grid-template-columns:repeat(${pairs === 4 ? 4 : 4},1fr)">${deck.map((k, i) => `<button class="mc" data-i="${i}" data-nosnd="1" aria-label="Carta ${i + 1}"><span class="back">${sym("heart", 24)}</span><span class="front" style="background-image:url(${foto(k)})"></span></button>`).join("")}</div>`);
  const cards = [...v.querySelectorAll(".mc")]; let open = [], lock = false, found = 0, moves = 0;

      $(v, "#hl").textContent = `Parejas ${found}/${pairs}`; if (found === pairs) setTimeout(() => completar(lv), 1000); }
    else { lock = true; setTimeout(() => { tone(220, .12, "sine", .1); cards[a].classList.remove("on"); cards[c].classList.remove("on"); open = []; lock = false; }, 850); }

/* =====================================================================
   3 · LA COPIA FALSA (encuentra las 5 figuras)
   ===================================================================== */
function gDetective(lv) {
  const easy = !!state.easy[lv];
  const v = levelFrame(lv, `<div class="gstats"><span id="hl">Encontradas 0/5</span><span id="hr"></span></div>
    <div class="detw"><span class="dl">ORIGINAL</span><canvas class="det" id="ca"></canvas></div>
    <div class="detw"><span class="dl">COPIA DEL LADRÓN · toca aquí</span><canvas class="det" id="cb"></canvas></div>
    <button class="btn ghost" id="pista" style="display:none">Ver una pista</button>`);
  const img = loadImg("g4"), A = $(v, "#ca"), B = $(v, "#cb"); let W, H, marks = [], found = 0, miss = 0, pulse = null;
  const kinds = ["heart", "star", "circle"], cols = [COL.rose, COL.gold, COL.sky, COL.mint, COL.lilac, "#fff"];
  function setup() {
    const d = Math.min(devicePixelRatio || 1, 2); W = A.clientWidth; H = Math.round(W * .7);
    for (const cv of [A, B]) { cv.width = W * d; cv.height = H * d; cv.style.height = H + "px"; cv.getContext("2d").setTransform(d, 0, 0, d, 0, 0); }
    while (marks.length < 5) { const m = { x: 28 + Math.random() * (W - 56), y: 24 + Math.random() * (H - 48), s: (easy ? 24 : 15) + Math.random() * 6, k: kinds[Math.random() * 3 | 0], col: cols[Math.random() * cols.length | 0], r: Math.random() * 6 };
      if (marks.every(o => Math.hypot(o.x - m.x, o.y - m.y) > 58)) marks.push(m); }
    draw();
  }
  function mark(c, m) { if (m.k === "heart") heartAt(c, m.x, m.y, m.s * 1.3, m.col, m.r * .2); else if (m.k === "star") starAt(c, m.x, m.y, m.s * .7, m.col); else { c.fillStyle = m.col; c.beginPath(); c.arc(m.x, m.y, m.s * .45, 0, TAU); c.fill(); } }
  function paint(cv, withMarks) {
    const c = cv.getContext("2d"); c.clearRect(0, 0, W, H); cover(c, img, 0, 0, W, H);
    if (withMarks) for (const m of marks) mark(c, m);
    for (const m of marks) if (m.f || m === pulse) { c.strokeStyle = m.f ? COL.gold : "#fff"; c.lineWidth = 3; c.setLineDash(m.f ? [] : [5, 4]); c.beginPath(); c.arc(m.x, m.y, m.s + 6, 0, TAU); c.stroke(); c.setLineDash([]); }
  }

  B.onpointerdown = e => {
    const r = B.getBoundingClientRect(), x = e.clientX - r.left, y = e.clientY - r.top;
    const m = marks.find(m => !m.f && Math.hypot(m.x - x, m.y - y) < Math.max(26, m.s + 10));
    if (m) { m.f = true; found++; sfx.right(); burst(e.clientX, e.clientY, 8); $(v, "#hl").textContent = `Encontradas ${found}/5`; draw(); if (found === 5) setTimeout(() => completar(lv), 1000); }
    else { miss++; state.err = (state.err || 0) + 1; store.set(state); tone(200, .15, "square", .07); B.classList.remove("shake"); void B.offsetWidth; B.classList.add("shake"); if (miss >= 3) $(v, "#pista").style.display = "block"; }
  };
  $(v, "#pista").onclick = () => { pulse = marks.find(m => !m.f); draw(); setTimeout(() => { pulse = null; draw(); }, 1300); };
}

/* =====================================================================
   4 · CORRE, JULISSA (runner)
   ===================================================================== */
function gRunner(lv) {
  const jump = g => { if (g.p.j < 2) { g.p.vy = g.p.j ? -520 : -620; g.p.j++; tone(480 + g.p.j * 140, .1, "triangle", .12, 0, 900); } };
  arcade(lv, {
    h: "min(44dvh,330px)",
    hud: g => `Distancia ${Math.min(100, g.dist / g.goal * 100 | 0)}%`,
    init(g) { g.gy = g.H - 44; g.p = { x: 72, y: g.gy, vy: 0, j: 0 }; g.obs = []; g.dist = 0; g.goal = g.easy ? 2000 : 3200; g.next = 1.1; g.st = Array.from({ length: 30 }, () => ({ x: Math.random() * g.W, y: Math.random() * (g.H - 80), r: Math.random() * 1.4 + .3 })); },
    down(g) { jump(g); }, key(g, k) { if (k === " " || k === "ArrowUp") jump(g); },
    update(g, dt) {
      const sp = (g.easy ? 200 : 250) * (1 + g.dist / g.goal * .45); g.sp = sp;
      g.dist += sp * dt;
      const p = g.p; p.vy += 1500 * dt; p.y += p.vy * dt; if (p.y >= g.gy) { p.y = g.gy; p.vy = 0; p.j = 0; }
      if ((g.next -= dt) <= 0 && g.dist < g.goal - 350) {
        const alto = Math.random() < .3; g.obs.push({ x: g.W + 20, w: alto ? 26 : 34, h: alto ? 48 : 28, alto });
        g.next = (g.easy ? 1.3 : .95) + Math.random() * (g.easy ? .9 : .7);
      }
      for (const o of g.obs) { o.x -= sp * dt; if (!o.hit && p.x + 13 > o.x + 3 && p.x - 13 < o.x + o.w - 3 && p.y > g.gy - o.h + 8) { o.hit = true; g.hurt(); } }
      g.obs = g.obs.filter(o => o.x > -60);
      for (const s of g.st) { s.x -= sp * .1 * dt; if (s.x < 0) s.x += g.W; }
      if (g.dist >= g.goal) g.win();
    },
    draw(g, c) {
      c.fillStyle = "#fff"; for (const s of g.st) { c.globalAlpha = .5; c.beginPath(); c.arc(s.x, s.y, s.r, 0, TAU); c.fill(); } c.globalAlpha = 1;
      c.fillStyle = "rgba(255,255,255,.08)"; c.fillRect(0, g.gy + 16, g.W, g.H);
      c.strokeStyle = "rgba(255,214,225,.5)"; c.lineWidth = 2; c.setLineDash([16, 14]); c.lineDashOffset = g.dist % 30; c.beginPath(); c.moveTo(0, g.gy + 16); c.lineTo(g.W, g.gy + 16); c.stroke(); c.setLineDash([]);
      const fx = g.p.x + (g.goal - g.dist);
      if (fx < g.W + 40) { c.fillStyle = "#fff"; c.fillRect(fx, g.gy - 60, 4, 76); c.fillStyle = COL.gold; c.beginPath(); c.moveTo(fx + 4, g.gy - 60); c.lineTo(fx + 40, g.gy - 50); c.lineTo(fx + 4, g.gy - 38); c.fill(); }
      for (const o of g.obs) {
        c.fillStyle = o.alto ? "#6a3b7a" : "#5a3a5c"; rr(c, o.x, g.gy + 16 - o.h, o.w, o.h, 6); c.fill();
        heartAt(c, o.x + o.w / 2, g.gy + 16 - o.h / 2, Math.min(o.w, o.h) * .72, COL.ghost); crack(c, o.x + o.w / 2, g.gy + 16 - o.h / 2, Math.min(o.w, o.h) * .72);
      }
      const p = g.p, leg = Math.sin(g.t * 18) * (p.y >= g.gy ? 5 : 0);
      if (g.inv > 0 && (g.t * 10 | 0) % 2) c.globalAlpha = .4;
      c.strokeStyle = "#2e0f2a"; c.lineWidth = 3; c.lineCap = "round"; c.beginPath(); c.moveTo(p.x - 5, p.y + 2); c.lineTo(p.x - 5 + leg, p.y + 15); c.moveTo(p.x + 5, p.y + 2); c.lineTo(p.x + 5 - leg, p.y + 15); c.stroke();
      cutie(c, p.x, p.y - 8, 38, g.t); c.globalAlpha = 1;
    }
  });
}

/* =====================================================================
   5 · VUELO DE CUPIDO (flappy suave)
   ===================================================================== */
function gFlappy(lv) {
  const flap = g => { g.go = true; g.b.vy = -330; tone(760, .07, "sine", .1, 0, 1100); };
  const crash = g => { if (g.inv > 0) return; g.hurt(); g.b.y = g.H / 2; g.b.vy = -120; g.pipes = g.pipes.filter(p => p.x > g.b.x + 140 || p.x + p.w < g.b.x - 30); };
  arcade(lv, {
    h: "min(58dvh,470px)",
    hud: g => `Nubes ${g.passed}/${g.goal}`,
    init(g) { g.b = { x: g.W * .3, y: g.H / 2, vy: 0 }; g.pipes = []; g.passed = 0; g.goal = g.easy ? 6 : 10; g.gap = g.easy ? 185 : 152; g.go = false; g.next = 0; },
    down(g) { flap(g); }, key(g, k) { if (k === " " || k === "ArrowUp") flap(g); },
    update(g, dt) {
      const b = g.b; if (!g.go) { b.y = g.H / 2 + Math.sin(g.t * 4) * 8; return; }
      const sp = g.easy ? 112 : 142;
      b.vy = Math.min(b.vy + (g.easy ? 860 : 990) * dt, 520); b.y += b.vy * dt;
      if ((g.next -= dt) <= 0) { g.pipes.push({ x: g.W + 30, gy: g.gap / 2 + 30 + Math.random() * (g.H - g.gap - 60), w: 56 }); g.next = g.easy ? 2.2 : 1.85; }
      for (const p of g.pipes) {
        p.x -= sp * dt;
        if (!p.done && p.x + p.w < b.x) { p.done = true; g.passed++; sfx.catch(); }
        if (b.x + 12 > p.x && b.x - 12 < p.x + p.w && (b.y - 11 < p.gy - g.gap / 2 || b.y + 11 > p.gy + g.gap / 2)) crash(g);
      }
      if (b.y > g.H - 8 || b.y < 6) crash(g);
      g.pipes = g.pipes.filter(p => p.x > -80);
      if (g.passed >= g.goal) g.win();
    },
    draw(g, c) {
      for (const p of g.pipes) {
        const top = p.gy - g.gap / 2, bot = p.gy + g.gap / 2;
        c.fillStyle = "rgba(255,214,225,.9)"; rr(c, p.x, -20, p.w, top + 20, 14); c.fill(); rr(c, p.x, bot, p.w, g.H - bot + 20, 14); c.fill();
        c.fillStyle = "#fff"; for (const [yy, dir] of [[top, -1], [bot, 1]]) { c.beginPath(); c.arc(p.x + 12, yy + dir * 6, 14, 0, TAU); c.arc(p.x + p.w / 2, yy + dir * 2, 17, 0, TAU); c.arc(p.x + p.w - 12, yy + dir * 6, 14, 0, TAU); c.fill(); }
      }
      const b = g.b, wing = Math.sin(g.t * 22) * 6;
      if (g.inv > 0 && (g.t * 10 | 0) % 2) c.globalAlpha = .4;
      c.fillStyle = "rgba(255,255,255,.95)"; c.beginPath(); c.ellipse(b.x - 14, b.y - 6 + wing * .3, 12, 6 + Math.abs(wing) * .5, -.5, 0, TAU); c.ellipse(b.x + 14, b.y - 6 + wing * .3, 12, 6 + Math.abs(wing) * .5, .5, 0, TAU); c.fill();
      c.save(); c.translate(b.x, b.y); c.rotate(Math.max(-.5, Math.min(.6, b.vy / 700))); cutie(c, 0, 0, 34, g.t); c.restore(); c.globalAlpha = 1;
      if (!g.go && g.run) { c.fillStyle = "#fff"; c.font = "800 15px Nunito, sans-serif"; c.textAlign = "center"; c.fillText("Toca para volar", g.W / 2, g.H * .78); }
    }

function gSpace(lv) {

    h: "min(62dvh,520px)",
    hud: g => g.boss ? `Jefe: el ladrón` : `Asteroides ${g.kills}/${g.need}`,
    init(g) {
      g.ship = { x: g.W / 2, y: g.H - 46 }; g.tx = g.W / 2; g.shots = []; g.rocks = []; g.eb = []; g.parts = []; g.fire = 0; g.next = .5;
      g.kills = 0; g.need = g.easy ? 10 : 14; g.boss = null; g.bossHP = g.easy ? 12 : 18;
      g.st = Array.from({ length: 50 }, () => ({ x: Math.random() * g.W, y: Math.random() * g.H, v: 20 + Math.random() * 60, r: Math.random() * 1.5 + .3 }));
    },
    down(g, x) { g.tx = x; }, move(g, x) { g.tx = x; },
    update(g, dt) {
      const k = g.keys, dir = (k.ArrowRight ? 1 : 0) - (k.ArrowLeft ? 1 : 0); if (dir) g.tx += dir * 420 * dt;
      g.tx = Math.max(24, Math.min(g.W - 24, g.tx)); g.ship.x += (g.tx - g.ship.x) * Math.min(1, dt * 12);
      for (const s of g.st) { s.y += s.v * dt; if (s.y > g.H) { s.y = 0; s.x = Math.random() * g.W; } }
      if ((g.fire -= dt) <= 0) { g.shots.push({ x: g.ship.x, y: g.ship.y - 20 }); g.fire = .22; tone(1200, .03, "square", .025, 0, 700); }
      for (const s of g.shots) s.y -= 520 * dt; g.shots = g.shots.filter(s => s.y > -10 && !s.dead);
      if ((g.next -= dt) <= 0) { const big = Math.random() < .25; g.rocks.push({ x: 20 + Math.random() * (g.W - 40), y: -24, v: (g.easy ? 80 : 100) + Math.random() * 60, r: big ? 24 : 15, hp: big ? 2 : 1, a: 0, va: (Math.random() - .5) * 2 }); g.next = g.boss ? 1.8 : (g.easy ? 1 : .8); }
      for (const r of g.rocks) { r.y += r.v * dt; r.a += r.va * dt;
        for (const s of g.shots) if (!s.dead && Math.hypot(s.x - r.x, s.y - r.y) < r.r + 4) { s.dead = true; if (--r.hp <= 0) { r.dead = true; g.kills++; sfx.catch(); boom(g, r.x, r.y, "#b99ab0", 10); } }
        if (!r.dead && Math.hypot(r.x - g.ship.x, r.y - g.ship.y) < r.r + 11) { r.dead = true; boom(g, r.x, r.y, COL.rose, 12); g.hurt(); } }
      g.rocks = g.rocks.filter(r => !r.dead && r.y < g.H + 30);
      if (!g.boss && g.kills >= g.need) { g.boss = { x: g.W / 2, y: -60, hp: g.bossHP, t: 0, fl: 0, cd: 1.5 }; tone(110, .6, "sawtooth", .12, 0, 60); }
      const B = g.boss;
      if (B) {
        B.t += dt; B.y += (86 - B.y) * Math.min(1, dt * 2); B.x = g.W / 2 + Math.sin(B.t * (g.easy ? .9 : 1.25)) * (g.W / 2 - 50); B.fl = Math.max(0, B.fl - dt);
        if ((B.cd -= dt) <= 0) { const dx = g.ship.x - B.x, dy = g.ship.y - B.y, d = Math.hypot(dx, dy); g.eb.push({ x: B.x, y: B.y + 30, vx: dx / d * 140, vy: dy / d * 140 }); B.cd = g.easy ? 2.2 : 1.6; }
        for (const s of g.shots) if (!s.dead && Math.abs(s.x - B.x) < 38 && Math.abs(s.y - B.y) < 40) { s.dead = true; B.hp--; B.fl = .08; tone(300, .05, "square", .05); if (B.hp <= 0) { boom(g, B.x, B.y, COL.gold, 50); fireworks(2600); g.boss = null; g.win(); return; } }
      }
      for (const e of g.eb) { e.x += e.vx * dt; e.y += e.vy * dt; if (Math.hypot(e.x - g.ship.x, e.y - g.ship.y) < 15) { e.dead = true; g.hurt(); } }
      g.eb = g.eb.filter(e => !e.dead && e.y < g.H + 20 && e.y > -20);
      for (const p of g.parts) { p.x += p.vx * dt; p.y += p.vy * dt; p.l -= dt * 1.4; } g.parts = g.parts.filter(p => p.l > 0);
    },
    draw(g, c) {
      c.fillStyle = "#fff"; for (const s of g.st) { c.globalAlpha = .35 + s.r * .3; c.fillRect(s.x, s.y, s.r, s.r * 2); } c.globalAlpha = 1;
      c.fillStyle = COL.gold; for (const s of g.shots) { rr(c, s.x - 2, s.y - 8, 4, 12, 2); c.fill(); }
      for (const r of g.rocks) { c.save(); c.translate(r.x, r.y); c.rotate(r.a); c.fillStyle = "#7a6a88"; c.beginPath(); for (let i = 0; i < 8; i++) { const a = i * TAU / 8, rad = r.r * (.8 + (i % 3) * .1); c.lineTo(Math.cos(a) * rad, Math.sin(a) * rad); } c.closePath(); c.fill(); c.fillStyle = "rgba(0,0,0,.25)"; c.beginPath(); c.arc(r.r * .25, -r.r * .2, r.r * .25, 0, TAU); c.fill(); c.restore(); }
      for (const e of g.eb) { heartAt(c, e.x, e.y, 20, COL.ghost); crack(c, e.x, e.y, 20); }
      const B = g.boss;
      if (B) { if (thiefImg.complete && thiefImg.naturalWidth) { c.globalAlpha = B.fl > 0 ? .5 : 1; c.drawImage(thiefImg, B.x - 44, B.y - 44, 88, 88); c.globalAlpha = 1; }
        c.fillStyle = "rgba(255,255,255,.2)"; rr(c, 20, 10, g.W - 40, 8, 4); c.fill(); c.fillStyle = COL.rose; rr(c, 20, 10, (g.W - 40) * B.hp / g.bossHP, 8, 4); c.fill(); }
      for (const p of g.parts) { c.globalAlpha = Math.max(0, p.l); c.fillStyle = p.col; c.beginPath(); c.arc(p.x, p.y, 2.5, 0, TAU); c.fill(); } c.globalAlpha = 1;
      const s = g.ship; if (g.inv > 0 && (g.t * 10 | 0) % 2) c.globalAlpha = .4;
      c.fillStyle = COL.orange; c.beginPath(); c.moveTo(s.x - 6, s.y + 14); c.lineTo(s.x, s.y + 22 + Math.random() * 8); c.lineTo(s.x + 6, s.y + 14); c.fill();
      c.fillStyle = COL.lilac; c.beginPath(); c.moveTo(s.x - 22, s.y + 12); c.lineTo(s.x, s.y - 4); c.lineTo(s.x + 22, s.y + 12); c.fill();

    }

  const v = show(h(`<section class="view"><p class="eyebrow" style="margin-top:22px">${items.eyebrow}</p><h2>${items.title}</h2>
    ${items.sub ? `<p class="quote">${items.sub}</p>` : ""}
    <div class="gal">${items.list.map((it, i) => `<figure class="pol" style="--r:${[-2.5, 2, -1.5, 2.5][i % 4]}deg"><img src="${it.src}" alt="${it.cap}"><figcaption>${it.cap}</figcaption></figure>`).join("")}</div>
    <p class="sub" style="font-size:13px">Desliza para ver más</p><div class="grow"></div><button class="btn ghost" id="b">Volver</button></section>`));
  $(v, "#b").onclick = back;
}
function galeriaEnergia() {
  const list = (state.energy || []).filter(Boolean).map((e, i) => ({ src: e.img, cap: e.label || `Regalo ${i + 1}` }));
  polaroids({ eyebrow: "Tu energía", title: "Las cosas que guardas", sub: "Siguen contigo, igual que yo.", list }, finalT2);
}
function galeriaRecuerdos() {
  const list = LV.slice(0, 11).map((L, i) => ({ src: foto(L.foto), cap: `Recuerdo #${i + 1}` }));
  polaroids({ eyebrow: "Recuerdos recuperados", title: "Todos de vuelta", list }, finalT2);
}

portada();
